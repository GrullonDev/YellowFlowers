name: yellow_flowers
description: "Flores Amarillas: mensajes personalizados con flores y animaciones sutiles, para compartir."
publish_to: "none"

version: 1.1.4

environment:
  sdk: ^3.5.1

dependencies:
  cupertino_icons: ^1.0.8
  firebase_core: ^3.5.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Fase 1 — observabilidad y re-enganche (ver
  # YellowFlowers_Analisis_Dinamismo_Social.docx, Fase 1):
  # analítica de producto, reporte de fallos y notificaciones push.
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_messaging: ^15.1.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get_it: ^8.0.3
  http: ^1.3.0
  package_info_plus: ^8.0.0
  intl: ^0.20.2
  just_audio: ^0.9.46
  provider: ^6.1.2
  google_fonts: ^6.2.1
  share_plus: ^11.1.0
  path_provider: ^2.1.3
  path: ^1.9.0
  pretty_qr_code: ^3.5.0
  lottie: ^3.1.2
  flutter_tts: ^3.8.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  gal: ^2.3.2
  file_picker: ^10.3.8
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1

  # Motivation & engagement: opt-in local daily reminder notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Offline/error handling: proactive connectivity awareness
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 30
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/lottie/flower_bloom.json
    - assets/images/logo.png
