name: Store Release (App Store Connect + Google Play)

# Se ejecuta a mano desde la pestaña Actions de GitHub.
# Los secrets necesarios están en docs/RELEASE.md.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Plataforma a publicar"
        type: choice
        options: [both, ios, android]
        default: both
      android_track:
        description: "Track de Google Play"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      android_status:
        description: "Estado del release en Google Play (usa draft si la app aún no está publicada)"
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  group: store-release
  cancel-in-progress: false

jobs:
  ios:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: flutter pub get

      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios beta

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ipa
          path: build/ios/fastlane/*.ipa
          if-no-files-found: ignore

  android:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAY_JSON_KEY_PATH: ${{ github.workspace }}/fastlane/play-service-account.json
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Write signing key and Play credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_JSON_KEY_PATH"

      - run: flutter pub get

      - name: Build and upload to Google Play
        run: bundle exec fastlane android deploy track:${{ inputs.android_track }} status:${{ inputs.android_status }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: ignore
