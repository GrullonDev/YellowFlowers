name: Store Release (App Store Connect + Google Play)

# Cuando cambia la versión en pubspec.yaml dentro de main se publica iOS en
# TestFlight y Android en la pista internal de Google Play. También se puede
# ejecutar a mano desde la pestaña Actions.
# Los secrets necesarios están en docs/RELEASE.md.
on:
  push:
    branches: [main]
    paths: [pubspec.yaml]
  workflow_dispatch:
    inputs:
      platform:
        description: "Plataforma a publicar"
        type: choice
        options: [both, ios, android]
        default: both
      android_track:
        description: "Track de Google Play"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      android_status:
        description: "Estado del release en Google Play (usa draft si la app aún no está publicada)"
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  group: store-release
  cancel-in-progress: false

jobs:
  ios:
    if: ${{ github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      # fastlane match: repo privado con el certificado y el perfil de distribución.
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
      # Con Swift Package Manager, `xcodebuild -showBuildSettings` resuelve los
      # paquetes y tarda más que el timeout por defecto de fastlane (3 s).
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "3"
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Todos los plugins por CocoaPods, igual que en Xcode Cloud: mezclar
      # Swift Package Manager y CocoaPods duplica dependencias (gRPC/Firebase).
      - run: flutter config --no-enable-swift-package-manager

      - run: flutter pub get

      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios beta

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ipa
          path: build/ios/fastlane/*.ipa
          if-no-files-found: ignore

  android:
    # En push a main sube a la pista internal; a mano se elige pista y estado.
    if: ${{ github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAY_JSON_KEY_PATH: ${{ github.workspace }}/fastlane/play-service-account.json
      ANDROID_TRACK: ${{ inputs.android_track || 'internal' }}
      ANDROID_STATUS: ${{ inputs.android_status || 'completed' }}
      # SHA-1 del certificado de carga registrado en Play Console.
      UPLOAD_CERT_SHA1: "EF:01:C1:61:A2:44:F3:03:63:1F:F9:8F:07:4B:AF:94:A3:AB:63:0C"
    steps:
      - name: Check Android secrets
        id: secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Sin secrets no se rompe el release de iOS: solo se omite Android.
            echo "::warning::Android omitido, faltan secrets:$missing (ver docs/RELEASE.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Faltan secrets de Android:$missing (ver docs/RELEASE.md)"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Read Flutter version from .fvmrc
        if: steps.secrets.outputs.ready == 'true'
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        if: steps.secrets.outputs.ready == 'true'
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Write signing key and Play credentials
        if: steps.secrets.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_JSON_KEY_PATH"

          # Falla antes de compilar si el keystore no es el registrado en Play.
          sha1=$(keytool -list -v -keystore android/app/upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            | awk '/SHA1:/ {print $2}')
          if [ "$sha1" != "$UPLOAD_CERT_SHA1" ]; then
            echo "::error::El keystore no coincide con el certificado de carga de Play (SHA-1: ${sha1:-ninguno})"
            exit 1
          fi

      - if: steps.secrets.outputs.ready == 'true'
        run: flutter pub get

      - name: Build and upload to Google Play
        if: steps.secrets.outputs.ready == 'true'
        run: bundle exec fastlane android deploy track:$ANDROID_TRACK status:$ANDROID_STATUS

      - uses: actions/upload-artifact@v4
        if: always() && steps.secrets.outputs.ready == 'true'
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: ignore
